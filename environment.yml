name: diffusion-sampler
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # ----------------------------------------------------------------
    # PyTorch  — pip 経由で CUDA 12.4 対応ビルドを取得する。
    # CUDA 12.x ドライバー (12.4〜12.9) と互換性あり。
    # MPS (Apple Silicon) 環境では --index-url を除いて再インストール。
    # ----------------------------------------------------------------
    - torch --index-url https://download.pytorch.org/whl/cu124
    - torchvision --index-url https://download.pytorch.org/whl/cu124

    # ----------------------------------------------------------------
    # Hugging Face スタック
    # ----------------------------------------------------------------
    - diffusers>=0.27.0        # scheduler / UNet インターフェース
    - transformers>=4.40.0     # CLIPTextModel / tokenizer
    - accelerate>=0.30.0       # 推論高速化 / device_map 対応
    - huggingface_hub>=0.23.0  # モデルダウンロード

    # ----------------------------------------------------------------
    # メトリクス
    # ----------------------------------------------------------------
    - torchmetrics[image]>=1.3.0  # PSNR / SSIM
    - clean-fid>=0.1.35           # KID (不偏推定量) / FID
    - open-clip-torch>=2.24.0     # CLIP Score (ViT-B/32)

    # ----------------------------------------------------------------
    # 可視化 / ノートブック
    # ----------------------------------------------------------------
    - matplotlib>=3.8.0
    - Pillow>=10.0.0
    - tqdm>=4.66.0
    - jupyterlab>=4.1.0
    - ipywidgets>=8.1.0

    # ----------------------------------------------------------------
    # ユーティリティ
    # ----------------------------------------------------------------
    - numpy>=1.26.0
    - scipy>=1.13.0   # KID の MMD 計算に利用
    - einops>=0.8.0   # テンソル操作を可読に
